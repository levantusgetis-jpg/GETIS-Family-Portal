<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17251d"><link rel="manifest" href="/manifest.webmanifest"><title>GETIS 家族私人门户</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#26372c;font:16px system-ui,"Microsoft YaHei",sans-serif}header{background:#17251d;color:#ead9a8;padding:25px max(20px,calc((100% - 880px)/2));font-size:26px;letter-spacing:3px}main{max-width:880px;margin:auto;padding:20px}.card{background:white;border:1px solid #e5dfd0;border-radius:13px;padding:20px;margin:15px 0}input,textarea,select{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font:inherit}button{border:0;border-radius:8px;background:#b69a5c;color:white;padding:12px 17px;margin:5px;cursor:pointer}.muted{color:#777;font-size:13px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}li{padding:7px;border-bottom:1px solid #eee}</style></head><body><header>GETIS <small>FAMILY DIGITAL PORTAL</small></header><main>
<section id="auth" class="card"><h2 id="authTitle">正在连接…</h2><p id="authHint" class="muted">首次启动创建族长账号；密码至少 14 位。</p><form id="authForm"><input id="username" placeholder="账号" required><label id="nameLabel" class="hidden">显示名称</label><input id="displayName" class="hidden" placeholder="显示名称"><input id="password" type="password" placeholder="密码（至少 14 位）" required minlength="14"><button>继续</button></form><p id="authMsg"></p></section>
<section id="app" class="hidden"><div class="card"><h2>家族工作台</h2><p id="welcome" class="muted"></p><button id="logout">退出登录</button></div><div class="grid"><section class="card"><h3>家族数据</h3><textarea id="state" rows="9" placeholder='{"members":[]}'></textarea><button id="save">保存云端数据</button><button id="reload">重新读取</button></section><section class="card"><h3>档案文件</h3><input id="file" type="file"><button id="upload">上传文件（最大 500KB）</button><ul id="docs"></ul></section></div><section class="card" id="membersCard"><h3>成员管理</h3><div id="newFields"><input id="newUser" placeholder="新账号"><input id="newName" placeholder="显示名称"><input id="newPass" type="password" placeholder="初始密码（至少 14 位）"><select id="role"><option value="member">普通成员</option><option value="admin">管理员</option></select><button id="add">创建成员</button></div><ul id="members"></ul></section><section class="card"><h3>审计记录</h3><button id="auditBtn">查看记录</button><ul id="audit"></ul></section></section></main>
<script>
let csrf="",user=null,bootstrap=false;const $=x=>document.getElementById(x);
async function api(p,o={}){let h={"content-type":"application/json"};if(o.method&&o.method!=="GET"&&csrf)h["x-csrf-token"]=csrf;let r=await fetch(p,{...o,headers:h}),d=await r.json().catch(()=>({error:"服务器响应错误"}));if(!r.ok)throw Error(d.error||"请求失败");return d}
async function loadState(){let d=await api("/api/state");$("state").value=d.json_data||"{}"}
async function docs(){let d=await api("/api/documents");$("docs").innerHTML="";d.documents.forEach(x=>{let li=document.createElement("li"),a=document.createElement("a");a.href="/api/documents/"+x.id;a.textContent=x.name+" · "+x.size+" bytes";li.append(a);$("docs").append(li)})}
async function members(){let d=await api("/api/users");$("members").innerHTML="";d.users.forEach(x=>{let li=document.createElement("li");li.textContent=x.display_name+" · "+x.username+" · "+x.role;$("members").append(li)})}
function enter(u){user=u;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("welcome").textContent=u.displayName+" · "+u.role;$("membersCard").classList.toggle("hidden",!["patriarch","admin"].includes(u.role));$("newFields").classList.toggle("hidden",u.role!=="patriarch");loadState().catch(e=>alert(e.message));docs().catch(e=>alert(e.message));if(["patriarch","admin"].includes(u.role))members()}
async function init(){try{bootstrap=!(await api("/api/auth/bootstrap-status")).initialized;$("authTitle").textContent=bootstrap?"首次启动 · 创建族长":"欢迎回来";$("nameLabel").classList.toggle("hidden",!bootstrap);$("displayName").classList.toggle("hidden",!bootstrap);$("authHint").textContent=bootstrap?"创建唯一族长账号，密码至少 14 位。":"请输入账号密码登录。";let d=await api("/api/auth/me");csrf=d.csrf||"";if(d.user)enter(d.user)}catch(e){$("authMsg").textContent=e.message}}
$("authForm").onsubmit=async e=>{e.preventDefault();try{let d={username:$("username").value,password:$("password").value};if(bootstrap)d.displayName=$("displayName").value;let r=await api(bootstrap?"/api/auth/bootstrap":"/api/auth/login",{method:"POST",body:JSON.stringify(d)});csrf=r.csrf;enter(r.user)}catch(e){$("authMsg").textContent=e.message}};
$("logout").onclick=async()=>{await api("/api/auth/logout",{method:"POST",body:"{}"});location.reload()};
$("save").onclick=async()=>{try{await api("/api/state",{method:"PUT",body:JSON.stringify({data:JSON.parse($("state").value||"{}")})});alert("保存成功")}catch(e){alert(e.message)}};$("reload").onclick=()=>loadState().catch(e=>alert(e.message));
$("upload").onclick=async()=>{let f=$("file").files[0];if(!f)return alert("请先选择文件");if(f.size>512000)return alert("免 R2 模式下单个文件最大 500KB");try{let b=new Uint8Array(await f.arrayBuffer()),s="";for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));await api("/api/documents",{method:"POST",body:JSON.stringify({name:f.name,mime:f.type,data:btoa(s)})});docs()}catch(e){alert(e.message)}};
$("add").onclick=async()=>{try{await api("/api/users",{method:"POST",body:JSON.stringify({username:$("newUser").value,displayName:$("newName").value,password:$("newPass").value,role:$("role").value})});members();alert("成员已创建")}catch(e){alert(e.message)}};
$("auditBtn").onclick=async()=>{try{let d=await api("/api/audit");$("audit").innerHTML="";d.events.forEach(x=>{let li=document.createElement("li");li.textContent=x.created_at+" · "+x.action+" · "+x.detail;$("audit").append(li)})}catch(e){alert(e.message)}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});init();
</script></body></html>
